name: release

# Tag-triggered. The release is created as a draft, filled in by the matrix,
# and only published once every platform has succeeded - so install.sh can
# never resolve a half-uploaded release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with Cargo.toml ships a binary whose --version
      # lies. Fail here rather than after five platform builds.
      - name: Check tag matches Cargo.toml version
        run: |
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="${{ steps.tag.outputs.tag }}"
          if [ "v$crate" != "$tag" ]; then
            echo "::error::tag $tag != Cargo.toml version v$crate"
            exit 1
          fi
          echo "version $crate OK"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.tag.outputs.tag }}" >/dev/null 2>&1 \
            || gh release create "${{ steps.tag.outputs.tag }}" \
                 --draft \
                 --title "${{ steps.tag.outputs.tag }}" \
                 --generate-notes

  build:
    needs: create-release
    # One platform failing shouldn't discard four good builds; the draft
    # stays unpublished either way.
    strategy:
      fail-fast: false
      matrix:
        include:
          # 24.04, not 22.04. The prebuilt ONNX Runtime that ort downloads is
          # itself built against glibc 2.38+ and libstdc++ 13+ (it needs
          # __isoc23_strtoll and _M_replace_cold), so linking on 22.04's
          # glibc 2.35 fails outright. The floor is ORT's, not ours.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # No x86_64-apple-darwin. Not an oversight and not a runner
          # problem: ort-sys 2.0.0-rc.13 ships no prebuilt ONNX Runtime for
          # that target at all -
          #   "no prebuilt binaries available for target x86_64-apple-darwin"
          # so it fails identically whether built natively or cross-compiled.
          # Intel Mac users have to build ONNX Runtime themselves; the README
          # says so. (The retired macos-13 runner was a separate red herring:
          # it never scheduled, which merely hid this error.)
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Every target is native, so the binary runs on its own builder.
      # Prove it starts before shipping it.
      - name: Smoke test
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/quality"
          [ "${{ runner.os }}" = "Windows" ] && bin="$bin.exe"
          "$bin" --version
          "$bin" --help > /dev/null

      # Record the actual symbol floor rather than assuming it. The README
      # states a minimum glibc; this is what proves or disproves it.
      - name: Report glibc floor
        if: runner.os == 'Linux'
        run: |
          bin="target/${{ matrix.target }}/release/quality"
          echo "max GLIBC:   $(objdump -T "$bin" | grep -oP 'GLIBC_[0-9.]+'   | sort -uV | tail -1)"
          echo "max GLIBCXX: $(objdump -T "$bin" | grep -oP 'GLIBCXX_[0-9.]+' | sort -uV | tail -1)"

      - name: Package
        shell: bash
        run: |
          name="quality-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/quality.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/quality" "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/"

          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
            asset="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi

          # install.sh fetches <asset>.sha256 and compares before unpacking.
          if command -v sha256sum > /dev/null; then
            sha256sum "$asset" | cut -d' ' -f1 > "$asset.sha256"
          else
            shasum -a 256 "$asset" | cut -d' ' -f1 > "$asset.sha256"
          fi
          echo "ASSET=$asset" >> "$GITHUB_ENV"
          ls -la

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag }}" \
            "dist/$ASSET" "dist/$ASSET.sha256" --clobber

  publish:
    needs: [create-release, build]
    # Runs even if a build job failed. Requiring every platform meant one
    # retired runner label could strand the release as an invisible draft
    # forever, which is exactly what happened with macos-13.
    if: always() && needs.create-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Publish if the core platforms shipped
        env:
          GH_TOKEN: ${{ github.token }}
          # This job does not check out the repo, so gh has no git remote to
          # infer the repository from and dies with "not a git repository".
          # Naming it explicitly is cheaper than a checkout.
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ needs.create-release.outputs.tag }}"
          have=$(gh release view "$tag" --json assets --jq '.assets[].name')
          echo "$have"

          # Missing any of these leaves most users with no binary at all,
          # so they gate publication.
          required="quality-x86_64-unknown-linux-gnu.tar.gz
          quality-aarch64-unknown-linux-gnu.tar.gz
          quality-aarch64-apple-darwin.tar.gz
          quality-x86_64-pc-windows-msvc.zip"

          missing=""
          for a in $required; do
            printf '%s\n' "$have" | grep -qx "$a" || missing="$missing $a"
          done
          if [ -n "$missing" ]; then
            echo "::error::release missing required assets:$missing"
            exit 1
          fi

          gh release edit "$tag" --draft=false
          echo "published $tag"
