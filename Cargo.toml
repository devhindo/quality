[package]
name = "quality"
version = "0.1.0"
edition = "2024"
# Edition 2024 needs 1.85. Stated so cargo reports it instead of failing
# with a confusing parse error on an older toolchain.
rust-version = "1.85"
description = "Make screenshots crisp enough to post"
license = "MIT"
readme = "README.md"
repository = "https://github.com/devhindo/quality"
homepage = "https://github.com/devhindo/quality"
keywords = ["screenshot", "upscale", "super-resolution", "cli"]
categories = ["command-line-utilities", "multimedia::images"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }
webp = "0.3.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
